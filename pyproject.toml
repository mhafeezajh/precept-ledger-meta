[project]
name = "precept-ledger"
version = "0.1.0"
description = "Gate and tamper-evident ledger for AI agent actions in regulated finance (Meta Global AI Developer Hackathon entry)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==50.0.2",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.12",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "ledger", "merkle", "witness", "anchor", "verify", "gate", "policy", "assist", "claims", "learn", "agent", "web"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; test keys and fixed seeds are TEST ONLY by design.
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["common", "ledger", "merkle", "verify", "witness", "claims", "gate", "anchor"]

[[tool.mypy.overrides]]
module = ["common.*", "ledger.*", "merkle.*", "verify.*", "witness.*", "claims.*", "gate.*", "anchor.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs the docker compose Postgres (make test-integration)",
  "live: calls a real model API; skipped by default",
]
addopts = "-m 'not integration and not live'"

[tool.coverage.run]
branch = true
source = ["common", "ledger", "merkle"]
# pg_store.py is exercised only against a real Postgres; make test-integration measures it.
omit = ["ledger/pg_store.py", "ledger/pg_tree.py"]  # covered by make test-integration

[tool.coverage.report]
fail_under = 90
show_missing = true
