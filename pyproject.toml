[project]
name = "precept-ledger"
version = "0.1.0"
description = "Gate and tamper-evident ledger for AI agent actions in regulated finance (Meta Global AI Developer Hackathon entry)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asn1crypto==1.5.1",
    "cedarpy==4.12.2",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "litellm==1.105.0",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "rfc8785==0.1.4",
    "uvicorn==0.54.0",
]

[project.scripts]
pl-verify = "verify.cli:main"
pl-export = "ledger.export_cli:main"
pl-ledger = "ledger.server:main"
pl-witness = "witness.server:main"
pl-gate = "gate.server:main"

[dependency-groups]
dev = [
    "hypothesis==6.170.12",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "ledger", "merkle", "witness", "anchor", "verify", "gate", "policy", "assist", "claims", "learn", "agent", "web"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; test keys and fixed seeds are TEST ONLY by design.
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["common", "ledger", "merkle", "verify", "witness", "claims", "gate", "anchor", "assist", "policy"]

[[tool.mypy.overrides]]
module = ["common.*", "ledger.*", "merkle.*", "verify.*", "witness.*", "claims.*", "gate.*", "anchor.*", "policy.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs the docker compose Postgres (make test-integration)",
  "live: calls a real model API; skipped by default",
]
addopts = "-m 'not integration and not live'"

[tool.coverage.run]
branch = true
source = ["common", "ledger", "merkle", "verify", "witness", "anchor", "gate", "assist", "claims", "policy"]
# Postgres modules, pl-export and the servers: make test-integration and the live smoke
# run. verify/__main__.py: a subprocess test.
omit = [
  "ledger/pg_store.py", "ledger/pg_tree.py", "ledger/export_cli.py", "ledger/server.py",
  "verify/__main__.py", "witness/server.py", "gate/server.py", "gate/pg_escalations.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[[tool.mypy.overrides]]
# asn1crypto ships no type hints; anchor/rfc3161.py checks every value it reads from it.
module = ["asn1crypto", "asn1crypto.*"]
ignore_missing_imports = true
