<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in | Precept Ledger {{ app_title }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css?v={{ static_version }}">
  <script src="/static/js/theme.js?v={{ static_version }}"></script>
</head>
<body>
<main id="main" class="signin">
  <div class="brand" aria-label="Precept Ledger {{ app_title }}, Harbor Federal">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true" focusable="false">
      <rect x="1" y="1" width="32" height="32" rx="7" fill="currentColor"/>
      <path class="brand-lines" d="M8 11h18M8 17h12M8 23h8" stroke-width="2.4" stroke-linecap="round"/>
      <path class="brand-lines" d="M20 23l2.6 2.6L27 20" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span><span class="brand-name">Precept Ledger</span><span class="brand-bank">Harbor Federal · {{ app_title }}</span></span>
  </div>
  <form class="panel" method="post" action="/sign-in" aria-labelledby="signin-heading">
    <h1 id="signin-heading">Sign in</h1>
    <p class="hint">You see the screens your role needs. Gate still checks every action.</p>
    {% if error %}<div class="notice notice--deny" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" value="{{ person }}" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64"{% if not person %} autofocus{% endif %}>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" maxlength="256"{% if person %} autofocus{% endif %}>
    </div>
    <div class="form-row"><button class="btn" type="submit">Sign in</button></div>
  </form>
  <p class="small muted">The other app: {% if app_name == "approvals" %}<a href="{{ console_url }}/sign-in">the Console</a>{% else %}<a href="{{ approvals_url }}/sign-in">the Approvals app</a>{% endif %}.</p>
</main>
</body>
</html>
